/* --- generar copia con la conexión incluida --- */
async function cnxGenerar(){if(!cnxValida(CNX))return msg('Primero guarde una URL y un token válidos en «Conexión»',1);
 const RX=/const CONEXION_FIJA=\{[^}]*\};/;let t=null;
 if(/^https?:$/.test(location.protocol)){try{const r=await fetch(location.href.split('#')[0],{cache:'no-store'});if(r.ok){const x=await r.text();if(RX.test(x))t=x}}catch(e){}}
 if(!t){msg('Elija en el selector este mismo archivo HTML del aplicativo');t=await new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept='.html,.htm';i.onchange=()=>{const f=i.files[0];if(!f)return res(null);const rd=new FileReader();rd.onload=()=>res(String(rd.result));rd.onerror=()=>res(null);rd.readAsText(f)};i.oncancel=()=>res(null);i.click()})}
 if(!t||!RX.test(t))return msg('No se pudo leer el archivo: seleccione el HTML del aplicativo',1);
 t=t.replace(RX,()=>'const CONEXION_FIJA='+JSON.stringify({url:CNX.url,token:CNX.token})+';');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/html;charset=utf-8'}));a.download='IGC_Mantenimiento_con_conexion.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
 msg('Listo: use «IGC_Mantenimiento_con_conexion.html» en todos sus dispositivos')}
